<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk Tania Renata</title>
<meta name="description" content="Sebuah kartu kecil, penuh sayang, untuk Tania Renata.">
<meta name="theme-color" content="#0d0709">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div id="cursor" aria-hidden="true"></div>

<!-- Gerbang pembuka (perlu satu sentuhan agar musik bisa diputar) -->
<main id="gate">
  <p class="kicker">sebuah kartu kecil</p>
  <h1 class="gate-title"><span>Untuk</span> <em id="gateName">Tania</em></h1>
  <button id="open" class="btn" type="button">
    <span>Buka kartunya</span>
    <i aria-hidden="true">♡</i>
  </button>
  <p class="hint">nyalakan suara untuk pengalaman terbaik</p>
</main>

<!-- Panggung animasi -->
<div id="stage" aria-live="polite"></div>

<!-- Kartu akhir -->
<section id="card" aria-hidden="true">
  <div class="card-in">
    <p class="kicker">kartu kecil untuk hatimu</p>
    <h2 id="fTitle"></h2>
    <p id="fText"></p>
    <p class="sign"><span>selalu milikmu,</span><em id="fFrom"></em></p>
    <div class="actions">
      <button id="replay" class="btn ghost" type="button"><span>Putar ulang</span><i aria-hidden="true">↺</i></button>
    </div>
  </div>
</section>

<!-- HUD -->
<footer id="hud" aria-hidden="true">
  <div id="segs"></div>
  <div class="ctrl">
    <button id="mute" type="button" aria-label="Suara">suara: on</button>
    <button id="skip" type="button" aria-label="Lewati">lewati ›</button>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
